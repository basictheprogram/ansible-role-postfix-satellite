---
# tasks file for postfix-satellite/main.yml

- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution_release }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
        - "main.yml"
      paths:
        - "vars"
  tags: postfix-satellite

- name: Import debian.yml
  import_tasks: debian.yml
  when: ansible_os_family == 'Debian'

- name: Install postfix config from template
  ansible.builtin.template:
    src: "postfix_main_cf.j2"
    dest: "/etc/postfix/main.cf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - Restart postfix
  tags: postfix-satellite

- name: Configure aliases database
  ansible.builtin.template:
    src: "aliases.j2"
    dest: "/etc/aliases"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - newaliases
  tags: postfix-satellite

- name: Create sasl_passwd
  ansible.builtin.template:
    src: "sasl_passwd.j2"
    dest: "{{ sasl_passwd }}"
    owner: "root"
    group: "root"
    mode: "0600"
  when:
    - postfix_conf.smtp_tls is defined
    - postfix_conf.smtp_sasl is defined
  notify:
    - postmap sasl_passwd
    - update ca-certificates
    - Restart postfix
  tags: postfix-satellite

- name: Postmap sasl_passwd
  ansible.builtin.command: "/usr/sbin/postmap hash:{{ sasl_passwd }}"
  changed_when: false
  when:
    - postfix_conf.smtp_tls is defined
    - postfix_conf.smtp_sasl is defined
  tags: postfix-satellite

- name: Set permissions on {{ sasl_passwd }}
  ansible.builtin.file:
    path: "{{ postfix_satellite_item }}"
    owner: "root"
    group: "root"
    mode: "0600"
  loop: "{{ sasl_conf }}"
  loop_control:
    loop_var: postfix_satellite_item
  when:
    - postfix_conf.smtp_tls is defined
    - postfix_conf.smtp_sasl is defined
  tags: postfix-satellite

- name: Set permissions on /etc/postfix/sasl directory
  ansible.builtin.file:
    path: "/etc/postfix/sasl"
    owner: "root"
    group: "root"
    mode: "0700"
  when:
    - postfix_conf.smtp_tls is defined
    - postfix_conf.smtp_sasl is defined
  tags: postfix-satellite

- name: Create generic table
  ansible.builtin.template:
    src: "generic.j2"
    dest: "{{ generic_table }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - postfix_conf.generic_table is defined
  notify:
    - postmap generic
    - Restart postfix

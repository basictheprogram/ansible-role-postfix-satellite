---
# tasks file for ansible-role-postfix-satellite

- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: postfix-satellite

- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution_release'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - "main.yml"
      paths:
        - "vars"
  tags: postfix-satellite

- name: Install postfix packages (Debian/Ubuntu)
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: postfix-satellite

- name: Install postfix packages (RedHat/EL)
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags: postfix-satellite

- name: Deploy postfix main.cf
  ansible.builtin.template:
    src: "postfix_main_cf.j2"
    dest: "/etc/postfix/main.cf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - Restart postfix
  tags: postfix-satellite

- name: Configure aliases database
  ansible.builtin.template:
    src: "aliases.j2"
    dest: "/etc/aliases"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - Newaliases
  tags: postfix-satellite

- name: Deploy SASL password map
  ansible.builtin.template:
    src: "sasl_passwd.j2"
    dest: "{{ sasl_passwd }}"
    owner: "root"
    group: "root"
    mode: "0600"
  when:
    - postfix_conf.smtp_tls is defined
    - postfix_conf.smtp_sasl is defined
  notify:
    - Postmap sasl_passwd
    - Update ca-certificates
    - Restart postfix
  tags: postfix-satellite

- name: Run postmap on SASL password map
  ansible.builtin.command: "/usr/sbin/postmap hash:{{ sasl_passwd }}"
  changed_when: false
  when:
    - postfix_conf.smtp_tls is defined
    - postfix_conf.smtp_sasl is defined
  tags: postfix-satellite

- name: Secure SASL credential files
  ansible.builtin.file:
    path: "{{ postfix_satellite_item }}"
    owner: "root"
    group: "root"
    mode: "0600"
  loop: "{{ sasl_conf }}"
  loop_control:
    loop_var: postfix_satellite_item
  when:
    - postfix_conf.smtp_tls is defined
    - postfix_conf.smtp_sasl is defined
  tags: postfix-satellite

- name: Secure /etc/postfix/sasl directory
  ansible.builtin.file:
    path: "/etc/postfix/sasl"
    owner: "root"
    group: "root"
    mode: "0700"
  when:
    - postfix_conf.smtp_tls is defined
    - postfix_conf.smtp_sasl is defined
  tags: postfix-satellite

- name: Deploy generic address rewrite table
  ansible.builtin.template:
    src: "generic.j2"
    dest: "{{ generic_table }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - postfix_conf.generic_table is defined
  notify:
    - Postmap generic
    - Restart postfix
  tags: postfix-satellite

- name: Fix postfix chroot jail ownership and permissions
  ansible.builtin.command: "/usr/sbin/postfix set-permissions"
  register: _postfix_set_permissions
  changed_when: false
  failed_when:
    - _postfix_set_permissions.rc != 0
    - "'No such file or directory' not in _postfix_set_permissions.stderr"
  tags: postfix-satellite

- name: Ensure /var/spool/postfix/etc/resolv.conf is owned by root
  ansible.builtin.file:
    path: "/var/spool/postfix/etc/resolv.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  tags: postfix-satellite

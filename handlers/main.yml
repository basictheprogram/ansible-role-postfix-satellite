---
# handlers file for roles/postfix-satellite

- name: restart postfix
  ansible.builtin.service:
    name: "postfix"
    state: restarted
  tags: postfix-satellite

- name: reload postfix
  ansible.builtin.service:
    name: "postfix"
    state: "reloaded"
  tags: postfix-satellite

- name: newaliases
  ansible.builtin.command: "/usr/bin/newaliases"
  tags: postfix-satellite

- name: postmap sasl_passwd
  ansible.builtin.command: "/usr/sbin/postmap hash:{{ sasl_passwd }}"
  tags: postfix-satellite

- name: update ca-certificates
  ansible.builtin.command: "/usr/sbin/update-ca-certificates"
  tags: postfix-satellite

- name: postmap generic
  ansible.builtin.command: "/usr/sbin/postmap hash:{{ generic_table }}"
  tags: postfix-satellite

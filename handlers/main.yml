---
# handlers file for roles/postfix-satellite

- name: restart postfix
  service: >
      name="postfix"
      state="restarted"
  tags: postfix

- name: reload postfix
  service: >
      name="postfix"
      state="reloaded"
  tags: postfix
    
- name: newaliases
  command: "/usr/bin/newaliases"
  tags: postfix

